<title id="workflow-title">Claude Code setup: /mode workflow</title>
<desc id="workflow-desc">The /mode command branches into five working modes: research, hack, study, project and real; global CLAUDE.md rules apply in every mode, and /recheck with update-all.sh keeps the tools current.</desc>
